services:
  lpa-dashboard:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/sirius-lpa-dashboard:latest
    build:
      dockerfile: docker/sirius-lpa-dashboard/Dockerfile
    depends_on:
      - sirius-mock
    ports: ["8888:8888"]
    privileged: false
    user: app
    read_only: true
    environment:
      PORT: 8888
      HEALTHCHECK: /lpa/dashboard/health-check
      SIRIUS_URL: http://sirius-mock:8080
      SIRIUS_PUBLIC_URL: http://localhost:8080

  sirius-mock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    ports: ["8563:8080"]
    volumes:
      - "./cypress/mocks:/home/wiremock/mappings"

  puppeteer:
    build: docker/puppeteer
    depends_on:
      - lpa-dashboard
    environment:
      - LHCI_BUILD_CONTEXT__CURRENT_HASH=$GITHUB_SHA
      - LHCI_BUILD_CONTEXT__GITHUB_REPO_SLUG=ministryofjustice/opg-sirius-lpa-dashboard
      - LHCI_GITHUB_APP_TOKEN

  go-lint:
    image: golangci/golangci-lint:v2.12.2@sha256:5cceeef04e53efe1470638d4b4b4f5ceefd574955ab3941b2d9a68a8c9ad5240
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint/v1.53.3:/root/.cache
    command: golangci-lint run -v --timeout 5m --enable gosec --output.text.path stdout --output.sarif.path test-results/golangci-lint.sarif

  gosec:
    image: golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
    working_dir: /app
    volumes:
      - .:/app
    command: go tool gosec -exclude-dir=.gocache -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...

  test-runner:
    build:
      context: docker/test-runner/
    command: gotestsum --junitfile test-results/unit-tests.xml -- ./... -coverprofile=test-results/test-coverage.txt
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.gocache:/go/pkg/mod

  pact:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/shared/opg-pact-cli:latest
    working_dir: /go/src/app
    volumes:
      - ./pacts:/go/src/app/pacts

  cypress:
    image: cypress/included:16.2.1@sha256:f1f257405a482bdf95358cd30202d9c3ac69f907d5e96342ae377b8111ff7a15
    command: run --browser chrome
    entrypoint: cypress
    depends_on:
      - lpa-dashboard
      - sirius-mock
    environment:
      - CYPRESS_BASE_URL=http://lpa-dashboard:8888
      - CYPRESS_MOCK_SERVER_URI=http://sirius-mock:8080
      - CYPRESS_VIDEO=false
    working_dir: /e2e
    volumes:
      - ./:/e2e
